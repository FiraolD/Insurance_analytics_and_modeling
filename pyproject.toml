[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-risk-analytics"
version = "0.1.0"
description = "Reproducible insurance risk analytics and predictive modelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.5,<2.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
]

[project.optional-dependencies]
modelling = [
  "xgboost>=2.0,<4.0",
  "shap>=0.46,<1.0",
  "imbalanced-learn>=0.12,<1.0",
  "dvc>=3.0,<4.0",
]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"
